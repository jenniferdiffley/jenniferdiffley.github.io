<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Jennifer Diffley</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231b4d45'/><text y='72' x='50' text-anchor='middle' font-size='62' font-family='Georgia,serif' fill='%23fbfaf7'>J</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..600,0..100,0..1&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap" rel="stylesheet">
<!-- Root-absolute paths are deliberate. GitHub Pages serves this file for a
     missing URL at ANY depth, so a relative href would resolve against that
     path (a bad /case-studies/xyz would look for /case-studies/main.css and
     load nothing). This assumes the site is served from the domain root,
     which is true for a <username>.github.io repo. If the site is ever moved
     to a project repo served under a subpath, prefix both with that subpath. -->
<link rel="stylesheet" href="/main.css">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('jd-theme');
      document.documentElement.setAttribute('data-theme',
        saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    } catch (e) {}
  })();
</script>
<style>
  .nf {
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 40px 24px;
  }
  .nf-num {
    font-family: var(--font-display);
    font-size: clamp(4rem, 16vw, 9rem);
    line-height: 1;
    color: var(--bronze);
    font-variation-settings: "WONK" 1;
    margin: 0 0 8px;
  }
  .nf h1 {
    font-size: clamp(1.5rem, 4vw, 2.25rem);
    font-weight: 400;
    margin: 0 0 16px;
  }
  .nf p {
    color: var(--ink-mid);
    max-width: 42ch;
    margin: 0 auto 32px;
  }
</style>
</head>
<body>
  <div class="nf">
    <div>
      <p class="nf-num">404</p>
      <h1>This page doesn’t exist.</h1>
      <p>
        Which is, admittedly, a content design failure on someone’s part. Let’s get you
        back to something that does.
      </p>
      <a class="btn" href="/">Back to the portfolio</a>
    </div>
  </div>
</body>
</html>
